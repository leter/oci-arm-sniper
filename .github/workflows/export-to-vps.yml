name: Export sniper env to VPS
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write env and keys on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID: ${{ secrets.IMAGE_ID }}
          AD_NAME: ${{ secrets.AD_NAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id"
          sed -i 's/\r$//' "$HOME/.ssh/id"
          chmod 600 "$HOME/.ssh/id"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def require(name: str) -> str:
              value = os.environ.get(name, "")
              if not value.strip():
                  raise SystemExit(f"missing or empty {name}")
              return value

          keys = [
              "OCI_CLI_USER",
              "OCI_CLI_TENANCY",
              "OCI_CLI_FINGERPRINT",
              "OCI_CLI_REGION",
              "OCI_COMPARTMENT_ID",
              "OCI_SUBNET_ID",
              "IMAGE_ID",
              "AD_NAME",
              "DISCORD_WEBHOOK_URL",
          ]
          extras = [
              "OCI_SHAPE=VM.Standard.A1.Flex",
              "OCI_OCPUS=2",
              "OCI_MEMORY_GBS=12",
              "OCI_BOOT_GBS=50",
              "OCI_DISPLAY_NAME=oci-a1-max",
              "SNIPER_INTERVAL_SEC=60",
          ]
          env_path = Path("/tmp/sniper.env")
          with env_path.open("w", encoding="utf-8") as fh:
              for key in keys:
                  fh.write(f"{key}={require(key)}\n")
              for line in extras:
                  fh.write(line + "\n")
          ssh_pub = require("SSH_PUBLIC_KEY")
          pem = require("OCI_CLI_KEY_CONTENT")
          Path("/tmp/ssh.pub").write_text(ssh_pub if ssh_pub.endswith("\n") else ssh_pub + "\n", encoding="utf-8")
          Path("/tmp/oci_api_key.pem").write_text(pem if pem.endswith("\n") else pem + "\n", encoding="utf-8")
          PY
          SSH=(ssh -p "$VPS_PORT" -i "$HOME/.ssh/id" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -P "$VPS_PORT" -i "$HOME/.ssh/id" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          "${SSH[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/oci-arm-sniper/logs && chmod 700 /opt/oci-arm-sniper"
          "${SCP[@]}" /tmp/sniper.env "$VPS_USER@$VPS_HOST:/opt/oci-arm-sniper/.env"
          "${SCP[@]}" /tmp/ssh.pub "$VPS_USER@$VPS_HOST:/opt/oci-arm-sniper/ssh.pub"
          "${SCP[@]}" /tmp/oci_api_key.pem "$VPS_USER@$VPS_HOST:/opt/oci-arm-sniper/oci_api_key.pem"
          "${SSH[@]}" "$VPS_USER@$VPS_HOST" "chmod 600 /opt/oci-arm-sniper/.env /opt/oci-arm-sniper/oci_api_key.pem /opt/oci-arm-sniper/ssh.pub"
          shred -u /tmp/sniper.env /tmp/ssh.pub /tmp/oci_api_key.pem "$HOME/.ssh/id" || true
